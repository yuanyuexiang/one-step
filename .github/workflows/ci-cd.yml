name: One Step CI and CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy main to the shared server
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Validate and build local stack
        run: |
          ./ops/local.sh config --quiet
          python3 ops/deploy/validate.py
          bash -n ops/deploy/release.sh
          shellcheck ops/deploy/release.sh
          ./ops/local.sh up -d --build --wait --wait-timeout 180
          ./ops/local.sh exec -T wordpress sh -c 'find wp-content/plugins/xdj-business wp-content/themes/xdj-site -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Initialize isolated CI database and test inquiry API
        run: |
          ./ops/local.sh run --rm --entrypoint wp scheduler core install --url=http://localhost:8080 --title='CI' --admin_user=ci-admin --admin_password="$(openssl rand -hex 24)" --admin_email=ci@example.invalid --skip-email
          ./ops/local.sh cp ops/seed-local.php scheduler:/tmp/seed-local.php
          ./ops/local.sh exec -T scheduler wp eval-file /tmp/seed-local.php
          python3 tests/inquiry-smoke.py
      - name: Stop CI stack
        if: always()
        run: ./ops/local.sh down
  images:
    needs: checks
    if: github.repository == 'yuanyuexiang/one-step' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [wordpress, scheduler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yuanyuexiang/one-step-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yuanyuexiang/one-step
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'ghcr.io/yuanyuexiang/one-step-%s@%s\n' "$SERVICE" "$DIGEST" > "$SERVICE.image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.service }}
          path: '*.image'
  deploy:
    needs: images
    if: github.repository == 'yuanyuexiang/one-step' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true)
    environment: production
    concurrency:
      group: onestep-deployment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          merge-multiple: true
      - name: Upload and deploy isolated release
        env:
          DEPLOY_HOST: ${{ vars.ONESTEP_DEPLOY_HOST || '18.175.156.130' }}
          DEPLOY_USER: ${{ vars.ONESTEP_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ONESTEP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONESTEP_DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/onestep
          chmod 600 ~/.ssh/onestep
          if [[ -n "$KNOWN_HOSTS" ]]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            cp ops/deploy/known_hosts ~/.ssh/known_hosts
          fi
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          target="/opt/onestep/releases/$GITHUB_SHA"
          ssh_opts=(-i ~/.ssh/onestep -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # shellcheck disable=SC2029 # Validated release path expands locally.
          ssh "${ssh_opts[@]}" "$remote" "mkdir -p '$target/ops/deploy'"
          scp "${ssh_opts[@]}" docker-compos.production.yaml wordpress.image scheduler.image "$remote:$target/"
          scp "${ssh_opts[@]}" ops/deploy/release.sh "$remote:$target/ops/deploy/"
          # Registry token is supplied over stdin and temporary Docker credentials are removed.
          # shellcheck disable=SC2029 # Paths and GitHub actor expand locally; Docker config expands remotely.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$remote" "set -eu; export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io -u '$REGISTRY_USER' --password-stdin; bash '$target/ops/deploy/release.sh'"
      - name: Verify public HTTPS
        run: |
          for lang in zh-hans zh-hant en fr de it es; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --max-time 60 "https://ai-onestep.com/$lang/" -o /dev/null
          done
