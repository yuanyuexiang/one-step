name: One Step CI and CD
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy master to the shared server
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: onestep-ci
      COMPOSE_FILE: docker-compos.yaml:docker-compos.local.yaml
      COMPOSE_ENV_FILES: .env.ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Prepare isolated CI configuration
        run: |
          cp .env.example .env.ci
          install -m 700 -d secrets
          (umask 077; openssl rand -hex 32 > secrets/db_password; openssl rand -hex 32 > secrets/db_root_password)
          # UID 33 inside scheduler must read this mounted file; host directory stays private.
          chmod 644 secrets/db_password
      - name: Validate and build
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T wordpress sh -c 'find wp-content/plugins/xdj-business wp-content/themes/xdj-site -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Initialize isolated CI database and test inquiry API
        run: |
          docker compose exec -T scheduler test -r /run/secrets/db_password
          docker compose exec -T scheduler wp core install --url=http://localhost:8080 --title='CI' --admin_user=ci-admin --admin_password="$(openssl rand -hex 24)" --admin_email=ci@example.invalid --skip-email
          docker compose cp ops/seed-local.php scheduler:/tmp/seed-local.php
          docker compose exec -T scheduler wp eval-file /tmp/seed-local.php
          python3 tests/inquiry-smoke.py
          docker compose exec -T scheduler wp plugin activate polylang
          docker compose cp ops/migration/languages.php scheduler:/tmp/languages.php
          docker compose exec -T scheduler wp eval-file /tmp/languages.php
          docker compose cp ops/migration/site-pages.php scheduler:/tmp/site-pages.php
          docker compose exec -T scheduler wp eval-file /tmp/site-pages.php
          docker compose cp tests/seed-migration.php scheduler:/tmp/seed-migration.php
          docker compose exec -T -e ONESTEP_CI=1 scheduler wp eval-file /tmp/seed-migration.php
          docker compose exec -T scheduler wp eval-file /var/www/html/wp-content/plugins/xdj-business/migrate.php
          docker compose exec -T scheduler wp eval-file /var/www/html/wp-content/plugins/xdj-business/migrate.php
          docker compose cp tests/migration-state.php scheduler:/tmp/migration-state.php
          docker compose exec -T scheduler wp eval-file /tmp/migration-state.php
          python3 tests/complete-site-smoke.py
          docker compose cp tests/image-variants.php scheduler:/tmp/image-variants.php
          docker compose exec -T -e ONESTEP_CI=1 scheduler wp eval-file /tmp/image-variants.php
      - name: Stop CI stack
        if: always()
        run: docker compose down
  images:
    needs: checks
    if: github.repository == 'yuanyuexiang/one-step' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [wordpress, scheduler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yuanyuexiang/one-step-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yuanyuexiang/one-step
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'ghcr.io/yuanyuexiang/one-step-%s@%s\n' "$SERVICE" "$DIGEST" > "$SERVICE.image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.service }}
          path: '*.image'
  deploy:
    needs: images
    if: github.repository == 'yuanyuexiang/one-step' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy == true)
    environment: production
    concurrency:
      group: onestep-deployment
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          merge-multiple: true
      - name: Upload and deploy isolated release
        env:
          DEPLOY_HOST: ${{ vars.ONESTEP_DEPLOY_HOST || '18.175.156.130' }}
          DEPLOY_USER: ${{ vars.ONESTEP_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ONESTEP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONESTEP_DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/onestep
          chmod 600 ~/.ssh/onestep
          if [[ -n "$KNOWN_HOSTS" ]]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            cp ops/deploy/known_hosts ~/.ssh/known_hosts
          fi
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          target="/opt/onestep/releases/$GITHUB_SHA"
          ssh_opts=(-i ~/.ssh/onestep -o StrictHostKeyChecking=yes -o BatchMode=yes)
          # shellcheck disable=SC2029 # Validated release path expands locally.
          ssh "${ssh_opts[@]}" "$remote" "umask 077; mkdir -p '$target'"
          scp "${ssh_opts[@]}" docker-compos.production.yaml wordpress.image scheduler.image "$remote:$target/"
          # Login via stdin; the subsequent remote shell removes temporary credentials.
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$remote" "umask 077; export DOCKER_CONFIG='$target/.docker'; mkdir -p \"\$DOCKER_CONFIG\"; docker login ghcr.io -u '$REGISTRY_USER' --password-stdin || { rm -rf \"\$DOCKER_CONFIG\"; exit 1; }"
          # shellcheck disable=SC2029
          # Read the complete SSH payload before Docker commands can consume stdin.
          ssh "${ssh_opts[@]}" "$remote" "script=\$(cat); bash -c \"\$script\" -- '$target'" <<'REMOTE'
          set -euo pipefail
          umask 077
          release_dir=$1
          export DOCKER_CONFIG="$release_dir/.docker"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          [[ "$release_dir" =~ ^/opt/onestep/releases/[0-9a-f]{40}$ ]] || { echo 'Invalid release directory'; exit 1; }
          exec 9>/opt/onestep/state/deploy.lock
          flock -n 9 || { echo 'Another onestep deployment is running'; exit 1; }
          [[ ! -e /opt/onestep/state/pending ]] || { echo 'Resolve previous pending deployment first'; exit 1; }
          cd "$release_dir"
          # Input files contain only checked image references, never shell commands.
          for image in wordpress scheduler; do
            value=$(cat "$image.image")
            [[ "$value" =~ ^ghcr\.io/yuanyuexiang/one-step-(wordpress|scheduler)@sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "$value" == "ghcr.io/yuanyuexiang/one-step-$image@"* ]] || exit 1
          done
          ONESTEP_WORDPRESS_IMAGE=$(cat wordpress.image)
          ONESTEP_SCHEDULER_IMAGE=$(cat scheduler.image)
          export ONESTEP_WORDPRESS_IMAGE ONESTEP_SCHEDULER_IMAGE
          compose=(docker compose --project-name onestep --env-file /opt/onestep/config/runtime.env -f "$release_dir/docker-compos.production.yaml")
          "${compose[@]}" config --quiet
          docker network inspect matrix-network >/dev/null
          "${compose[@]}" pull db wordpress scheduler
          if [[ ! -f /opt/onestep/state/current ]]; then
            # First release restores the prepared site, with its public router disabled.
            import_dir=/opt/onestep/import
            test -s "$import_dir/database.sql"
            test -s "$import_dir/uploads.tar.gz"
            test -s "$import_dir/languages.tar.gz"
            (cd "$import_dir" && sha256sum --check SHA256SUMS)
            printf 'services:\n  wordpress:\n    labels:\n      traefik.enable: "false"\n' > bootstrap.yaml
            bootstrap=("${compose[@]}" -f "$release_dir/bootstrap.yaml")
            printf '%s\n' "$release_dir" > /opt/onestep/state/pending
            "${bootstrap[@]}" up -d --no-build --wait --wait-timeout 180 db wordpress
            # Refuse to replace any pre-existing database without a verified release record.
            # shellcheck disable=SC2016
            tables=$("${bootstrap[@]}" exec -T db sh -c 'MYSQL_PWD="$(cat /run/secrets/db_root_password)" exec mysql -uroot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE()" "$MYSQL_DATABASE"')
            [[ "$tables" == 0 ]] || { echo 'Existing data found; manual reconciliation required'; exit 1; }
            # shellcheck disable=SC2016
            "${bootstrap[@]}" exec -T db sh -c 'MYSQL_PWD="$(cat /run/secrets/db_root_password)" exec mysql -uroot "$MYSQL_DATABASE"' < "$import_dir/database.sql"
            "${bootstrap[@]}" exec -T wordpress tar -xzf - -C /var/www/html/wp-content/uploads < "$import_dir/uploads.tar.gz"
            "${bootstrap[@]}" exec -T wordpress mkdir -p /var/www/html/wp-content/languages
            "${bootstrap[@]}" exec -T wordpress tar -xzf - -C /var/www/html/wp-content/languages < "$import_dir/languages.tar.gz"
            "${bootstrap[@]}" exec -T wordpress chown -R www-data:www-data /var/www/html/wp-content/uploads
            "${bootstrap[@]}" run --rm --no-deps --entrypoint wp scheduler core is-installed
            "${bootstrap[@]}" run --rm --no-deps --entrypoint wp scheduler search-replace http://localhost:8080 https://ai-onestep.com --all-tables-with-prefix --skip-columns=guid --precise
            "${bootstrap[@]}" run --rm --no-deps --entrypoint wp scheduler rewrite flush
          else
            "${compose[@]}" run --rm --no-deps --entrypoint wp scheduler core is-installed
            backup_dir="/opt/onestep/backups/$(date -u +%Y%m%dT%H%M%SZ)-${release_dir##*/}"
            mkdir -p "$backup_dir"
            printf '%s\n' "$release_dir" > /opt/onestep/state/pending
            "${compose[@]}" stop scheduler wordpress
            # shellcheck disable=SC2016
            "${compose[@]}" exec -T db sh -c 'MYSQL_PWD="$(cat /run/secrets/db_root_password)" exec mysqldump -uroot --single-transaction --routines --triggers --events --no-tablespaces "$MYSQL_DATABASE"' > "$backup_dir/database.sql"
            test -s "$backup_dir/database.sql"
            "${compose[@]}" run --rm --no-deps --entrypoint tar -v "$backup_dir:/backup" wordpress -czf /backup/wordpress.tar.gz -C /var/www/html .
            tar -tzf "$backup_dir/wordpress.tar.gz" >/dev/null
            (cd "$backup_dir" && sha256sum database.sql wordpress.tar.gz > SHA256SUMS)
          fi
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180 db wordpress
          "${compose[@]}" run --rm -T --no-deps --entrypoint wp scheduler eval-file /var/www/html/wp-content/plugins/xdj-business/migrate.php < /dev/null
          "${compose[@]}" run --rm -T --no-deps --entrypoint wp scheduler eval-file /var/www/html/wp-content/plugins/xdj-business/optimize-media.php < /dev/null
          "${compose[@]}" run --rm --no-deps --entrypoint wp scheduler core is-installed
          actual=$(docker inspect --format '{{.Config.Image}}' "$("${compose[@]}" ps -q wordpress)")
          [[ "$actual" == "$ONESTEP_WORDPRESS_IMAGE" ]]
          for lang in zh-hans zh-hant en fr de it es; do
            curl --fail --silent --show-error --location --retry 18 --retry-all-errors --retry-delay 10 --connect-timeout 5 --max-time 20 "https://ai-onestep.com/$lang/" -o /dev/null
          done
          "${compose[@]}" up -d --no-build scheduler
          actual=$(docker inspect --format '{{.Config.Image}}' "$("${compose[@]}" ps -q scheduler)")
          [[ "$actual" == "$ONESTEP_SCHEDULER_IMAGE" ]]
          if [[ -f /opt/onestep/state/current ]]; then cp /opt/onestep/state/current /opt/onestep/state/previous; fi
          printf '%s\n' "$release_dir" > /opt/onestep/state/current
          rm /opt/onestep/state/pending
          printf 'Published %s\n' "${release_dir##*/}"
          REMOTE
      - name: Verify public HTTPS
        run: |
          for lang in zh-hans zh-hant en fr de it es; do
            curl --fail --silent --show-error --location --retry 18 --retry-all-errors --retry-delay 10 --connect-timeout 5 --max-time 20 "https://ai-onestep.com/$lang/" -o /dev/null
          done
