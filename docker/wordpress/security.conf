# Private audit records persist in wp_data and must never be served over HTTP.
<Directory /var/www/html/wp-content/xdj-private>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "^/xmlrpc\.php(?:/|$)">
    Require all denied
</LocationMatch>
